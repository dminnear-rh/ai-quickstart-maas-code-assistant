{{- range $user, $config := .Values.global.users }}
{{- range $role := $config.clusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $user }}-{{ $role }}
  labels:
    {{- include "user-config.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user }}
{{- end }}
{{- end }}
