{{- if .Values.dbSecret.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.dbSecret.serviceAccountName }}
  namespace: {{ .Values.cnpg.cluster.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.dbSecret.serviceAccountName }}
  namespace: {{ .Values.cnpg.cluster.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.cnpg.cluster.name }}-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.dbSecret.serviceAccountName }}
  namespace: {{ .Values.cnpg.cluster.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.dbSecret.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.dbSecret.serviceAccountName }}
    namespace: {{ .Values.cnpg.cluster.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cnpg-kubernetes-backend
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.cnpg.cluster.namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: {{ .Values.cnpg.cluster.namespace }}
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Values.dbSecret.serviceAccountName }}
          namespace: {{ .Values.cnpg.cluster.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecret.targetSecretName }}
  namespace: {{ .Values.dbSecret.targetNamespace }}
spec:
  refreshInterval: {{ .Values.dbSecret.refreshInterval }}
  secretStoreRef:
    name: cnpg-kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecret.targetSecretName }}
  data:
    - secretKey: {{ .Values.dbSecret.targetSecretKey }}
      remoteRef:
        key: {{ .Values.cnpg.cluster.name }}-app
        property: {{ .Values.dbSecret.sourceSecretKey }}
{{- end }}
